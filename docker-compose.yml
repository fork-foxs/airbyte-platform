version: '3.8'

services:
  label-studio:
    image: heartexlabs/label-studio:latest
    container_name: label-studio
    ports:
      - "8200:8200"
    volumes:
      - ./label-studio/mydata:/label-studio/data
    user: "1000:1000"
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3001:3000"
    restart: unless-stopped

  dagster:
    image: my-tools-dagster
    container_name: dagster
    ports:
      - "3000:3000"
    restart: unless-stopped

  dagster-postgres:
    image: postgres:15
    container_name: dagster-postgres
    environment:
      POSTGRES_USER: dagster
      POSTGRES_PASSWORD: dagster
      POSTGRES_DB: dagster
    ports:
      - "5433:5432"
    restart: unless-stopped

  airbyte-server:
    image: airbyte/server:1.8.2
    container_name: airbyte-server
    ports:
      - "8000:8000"
    restart: unless-stopped

  airbyte-postgres:
    image: postgres:15
    container_name: airbyte-postgres
    environment:
      POSTGRES_USER: airbyte
      POSTGRES_PASSWORD: airbyte
      POSTGRES_DB: airbyte
    ports:
      - "5434:5432"
    restart: unless-stopped

  dbt:
    image: python:3.11-slim
    container_name: dbt
    command: sleep infinity
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
    command: server /data
    volumes:
      - ./minio/data:/data
    restart: unless-stopped
